name: Sale 01 qualification
on:
  push:
    branches: [main, "sale01/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test harness only
        run: python -m pip install pytest
      - name: Compile Python sources
        run: python -m compileall -q software
      - name: Full regression suite
        run: python -m pytest -q
      - name: Deterministic sample workflow
        run: python software/run_demo.py
      - name: Independently verify sample report
        run: python software/verify.py output/drift_report.json
      - name: Independently verify sample evidence export
        run: python software/verify.py output/drift_evidence.json
      - name: Qualify bundled deployment-approval pack
        run: python -m pytest -q tests/test_self_service.py
      - name: Build exact-commit licensing evaluation archive
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: python tools/build_license_candidate.py
      - name: Preserve evaluation ZIP and SHA-256 receipt
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: CDD-license-eval-${{ github.sha }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30
