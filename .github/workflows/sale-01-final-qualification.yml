name: Sale 01 Final Qualification

on:
  push:
    branches:
      - sale/qualification-2026-10-04
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-final:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact final sale candidate
        uses: actions/checkout@v4
        with:
          ref: 94a97d3102b3e69f519f3fa8cb740bc61dce461d
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install qualification test runner
        run: python -m pip install --disable-pip-version-check pytest

      - name: Record identity
        run: |
          mkdir -p qualification
          echo "candidate_commit=$(git rev-parse HEAD)" | tee qualification/identity.txt
          echo "candidate_tree=$(git rev-parse HEAD^{tree})" | tee -a qualification/identity.txt
          python --version 2>&1 | tee qualification/python_version.txt

      - name: Full tests
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee qualification/pytest_output.txt

      - name: Local UI source gate
        run: |
          python -m py_compile software/ui_app.py
          python - <<'PY'
          import ast
          from pathlib import Path
          path = Path('software/ui_app.py')
          tree = ast.parse(path.read_text(encoding='utf-8'))
          imports = set()
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  imports.update(alias.name.split('.')[0] for alias in node.names)
              elif isinstance(node, ast.ImportFrom) and node.module:
                  imports.add(node.module.split('.')[0])
          forbidden = {'requests', 'httpx', 'urllib3', 'socket'}
          found = sorted(imports & forbidden)
          if found:
              raise SystemExit(f'FAIL: unexpected network-oriented UI import(s): {found}')
          source = path.read_text(encoding='utf-8')
          required = [
              'from compliance_drift_detector import ComplianceDriftDetector',
              'from run_scan import load_evidence, load_policies',
              'from verify import verify_drift_evidence, verify_drift_report',
          ]
          missing = [item for item in required if item not in source]
          if missing:
              raise SystemExit(f'FAIL: UI engine/verifier bindings missing: {missing}')
          Path('qualification/ui_gate.txt').write_text('PASS: UI compiles, has no network-oriented imports, and binds to existing engine/loaders/verifier.\n')
          print('PASS: local UI source gate')
          PY

      - name: Built-in demo and verification
        run: |
          rm -rf input output
          python software/run_scan.py 2>&1 | tee qualification/demo_run_output.txt
          test -f output/drift_report.html
          test -f output/drift_report.md
          test -f output/drift_report.json
          test -f output/drift_evidence.json
          python software/verify.py output/drift_report.json 2>&1 | tee qualification/demo_verify_report.txt
          python software/verify.py output/drift_evidence.json 2>&1 | tee qualification/demo_verify_evidence.txt
          cp -R output qualification/demo_output

      - name: Self-service CSV path and verification
        run: |
          rm -rf input output
          mkdir -p input
          cp examples/template_packs/deployment_approval/policy_claims.csv input/policy_claims.csv
          cp examples/template_packs/deployment_approval/behavior_evidence.csv input/behavior_evidence.csv
          python software/run_scan.py 2>&1 | tee qualification/self_service_run_output.txt
          python software/verify.py output/drift_report.json 2>&1 | tee qualification/self_service_verify_report.txt
          python software/verify.py output/drift_evidence.json 2>&1 | tee qualification/self_service_verify_evidence.txt
          cp -R output qualification/self_service_output

      - name: Semantic determinism
        run: |
          cp output/drift_report.json qualification/run1.json
          rm -rf output
          python software/run_scan.py > qualification/determinism_second_run.txt 2>&1
          cp output/drift_report.json qualification/run2.json
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('qualification/run1.json').read_text())
          b=json.loads(Path('qualification/run2.json').read_text())
          for d in (a,b):
              d.pop('generated_at', None)
              d.pop('report_hash', None)
          if a != b:
              raise SystemExit('FAIL: semantic outputs differ')
          Path('qualification/determinism_result.txt').write_text('PASS: semantic outputs identical for identical inputs; timestamp-derived fields excluded.\n')
          PY

      - name: Sale claim hygiene scan
        run: |
          if grep -RInE --exclude-dir=.git --exclude-dir=qualification '(#1 reason companies fail audits|cryptographic proof of when drift started|27 automated tests, all PASS|Continuous monitoring between audit points|python software/verify.py</code>|python software/verify.py$)' .; then
            echo 'FAIL: stale sale claim/instruction found'
            exit 1
          fi
          echo 'PASS: targeted stale claim/instruction scan clean.' | tee qualification/claim_hygiene.txt

      - name: Runtime dependency posture
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('pyproject.toml').read_text()
          if 'dependencies' in text:
              raise SystemExit('Review required: dependencies declaration found')
          Path('qualification/runtime_dependency_check.txt').write_text('PASS: no project runtime dependencies declared. Desktop UI uses Tkinter when available; core scanner/verifier remain stdlib-only.\n')
          PY

      - name: Basic sensitive-material scan
        run: |
          set +e
          grep -RInE --exclude-dir=.git --exclude-dir=qualification --exclude='*.pyc' '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|AKIA[0-9A-Z]{16}|password[[:space:]]*=[[:space:]]*[^[:space:]]+|secret[[:space:]]*=[[:space:]]*[^[:space:]]+|token[[:space:]]*=[[:space:]]*[^[:space:]]+)' . > qualification/sensitive_scan.txt
          rc=$?
          if [ "$rc" -eq 0 ]; then cat qualification/sensitive_scan.txt; exit 1; fi
          if [ "$rc" -eq 1 ]; then echo 'PASS: no obvious credential/private-key patterns found.' > qualification/sensitive_scan.txt; exit 0; fi
          exit "$rc"

      - name: Build frozen final source archive
        run: |
          rm -rf input output
          find . -type f -not -path './.git/*' -not -path './qualification/*' -not -path './__pycache__/*' -not -path './software/__pycache__/*' -print | sort > qualification/repository_file_inventory.txt
          mkdir -p qualification/archive_root/COMPLIANCE_DRIFT_DETECTOR_SALE_01_SOURCE
          while IFS= read -r f; do
            rel="${f#./}"
            mkdir -p "qualification/archive_root/COMPLIANCE_DRIFT_DETECTOR_SALE_01_SOURCE/$(dirname "$rel")"
            cp "$rel" "qualification/archive_root/COMPLIANCE_DRIFT_DETECTOR_SALE_01_SOURCE/$rel"
          done < qualification/repository_file_inventory.txt
          (cd qualification/archive_root && zip -qr ../COMPLIANCE_DRIFT_DETECTOR_SALE_01_SOURCE.zip COMPLIANCE_DRIFT_DETECTOR_SALE_01_SOURCE)
          sha256sum qualification/COMPLIANCE_DRIFT_DETECTOR_SALE_01_SOURCE.zip | tee qualification/source_archive.sha256

      - name: Final qualification receipt
        run: |
          TEST_LINE=$(tail -n 1 qualification/pytest_output.txt)
          COMMIT=$(git rev-parse HEAD)
          TREE=$(git rev-parse HEAD^{tree})
          PYVER=$(cat qualification/python_version.txt)
          ARCHIVE_HASH=$(cut -d' ' -f1 qualification/source_archive.sha256)
          cat > qualification/SALE_QUALIFICATION_RECEIPT.md <<EOF
          # ComplianceDriftDetector — FINAL Sale 01 Qualification Receipt

          **Qualification date:** 2026-10-04  
          **Candidate commit:** \`$COMMIT\`  
          **Candidate tree:** \`$TREE\`  
          **Environment:** $PYVER  
          **Test result:** $TEST_LINE  

          ## Gates
          - Full pytest suite: PASS
          - Local UI compile/binding/no-network-import source gate: PASS
          - Built-in demo + report/evidence verification: PASS
          - Self-service CSV path + report/evidence verification: PASS
          - Semantic deterministic re-run: PASS
          - Targeted stale claim/instruction scan: PASS
          - Runtime dependency posture: PASS
          - Basic sensitive-material scan: PASS

          ## Frozen source
          \`COMPLIANCE_DRIFT_DETECTOR_SALE_01_SOURCE.zip\`  
          SHA-256: \`$ARCHIVE_HASH\`

          ## Boundary
          This qualifies the exact candidate above. It does not claim production-scale validation, regulatory certification, audit acceptance, real-time monitoring, or enterprise SaaS readiness.
          EOF
          cat qualification/SALE_QUALIFICATION_RECEIPT.md

      - name: Upload final qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: COMPLIANCE_DRIFT_DETECTOR_SALE_01_UI_FINAL_QUALIFICATION
          path: qualification/
          if-no-files-found: error
          retention-days: 30
