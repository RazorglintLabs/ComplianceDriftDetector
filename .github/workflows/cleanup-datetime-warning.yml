name: Final datetime warning cleanup

on:
  push:
    branches:
      - cleanup/datetime-warning

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/datetime-warning
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replace deprecated UTC timestamp calls and test
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('software/compliance_drift_detector.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace('from datetime import datetime\n', 'from datetime import datetime, timezone\n')
          old = 'datetime.utcnow().isoformat() + "Z"'
          new = 'datetime.now(timezone.utc).isoformat().replace("+00:00", "Z")'
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'Expected exactly 2 deprecated UTC calls, found {count}')
          text = text.replace(old, new)
          p.write_text(text, encoding='utf-8')
          PY
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q
      - name: Commit cleanup
        run: |
          git config user.name "RazorglintLabs"
          git config user.email "razorglint.ops@protonmail.com"
          git add software/compliance_drift_detector.py
          git commit -m "Replace deprecated UTC timestamp calls"
          git push origin HEAD:cleanup/datetime-warning
